map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream collab_frontend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name collabu.kz www.collabu.kz;

    server_tokens off;

    # Let's Encrypt challenge endpoint
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # App health endpoint from reverse proxy side
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location / {
        proxy_pass http://collab_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # Flutter web uses stable names for its runtime and assets. Long-lived
    # immutable caching can therefore mix an old JS bundle with a newly
    # deployed AssetManifest and make icons/images disappear until users clear
    # their browser cache.
    location ~* \.(?:js|css|map|jpg|jpeg|gif|png|svg|ico|webp|woff2?)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;

        proxy_pass http://collab_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
