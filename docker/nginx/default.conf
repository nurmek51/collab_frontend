server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Flutter keeps several runtime and asset file names stable between builds.
  # Always revalidate them so a deployment cannot leave a browser with an old
  # asset manifest and a new application bundle (or vice versa).
  add_header Cache-Control "no-cache, no-store, must-revalidate" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /health {
    add_header Content-Type text/plain;
    return 200 'ok';
  }
}
